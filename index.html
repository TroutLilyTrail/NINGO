<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inhabitect Office NINGO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --forest: #1e3a2f;
    --lime: #8fbe3f;
    --charcoal: #2c2c2c;
    --cream: #f5f0e8;
    --mid: #4a7c59;
    --light-green: #e8f4e0;
    --accent: #c8e87a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #d8d0c4;
    padding: 20px;
    color: var(--charcoal);
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    text-align: center;
    font-size: 42px;
    letter-spacing: 4px;
    color: var(--forest);
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    font-size: 12px;
    color: #666;
    margin-bottom: 30px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 28px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .bingo-card {
    background: var(--cream);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .card-header {
    background: var(--forest);
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 6px;
    color: var(--lime);
  }

  .card-num {
    font-size: 11px;
    color: #8a9e8a;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .bingo-letters {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: var(--mid);
  }

  .bingo-letter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--accent);
    text-align: center;
    padding: 6px 0;
    border-right: 1px solid rgba(255,255,255,0.1);
  }

  .bingo-letter:last-child { border-right: none; }

  .bingo-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
  }

  .bingo-cell {
    border: 1px solid #ccc;
    height: 74px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4px 5px;
    font-size: 9.5px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--charcoal);
    background: var(--cream);
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }

  .bingo-cell:hover {
    background: #e8e0d4;
  }

  .bingo-cell.marked {
    background: var(--lime) !important;
    color: var(--forest);
    font-weight: 700;
  }

  .bingo-cell.free-space {
    background: var(--forest);
    color: var(--lime);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
  }

  .bingo-cell.free-space:hover {
    background: var(--forest);
  }

  .free-icon {
    font-size: 20px;
    display: block;
    margin-bottom: 2px;
  }

  @media print {
    body { background: white; padding: 10px; }
    .cards-grid { gap: 16px; }
    .bingo-cell { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .card-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .bingo-letters { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<h1>INHABITECT OFFICE NINGO</h1>
<div class="subtitle">🌿 Click to mark &nbsp;·&nbsp; Print for field use &nbsp;·&nbsp; First to NINGO buys lunch</div>

<div class="cards-grid" id="cardsGrid"></div>

<script>
const ALL_SQUARES = [
  '"Shovels in the ground"',
  '"Brendan?" (summons from desk)',
  '"Missy?" (summons from desk)',
  '"I\'m so underwater right now"',
  'Hydrotech',
  '"I need a permit update"',
  '"That\'s something that Matt didn\'t..."',
  'Missed deadline',
  'Hijacked a meeting',
  'Chewing loudly during meeting',
  'Out of office for a mystery meeting',
  '"Control the narrative"',
  'Chases big jobs we can\'t handle instead of executing the small jobs well',
  '"Hey guys"',
  '"That\'s a Dave thing"',
  '"He/she is really dropping the ball"',
  '"My buddy..."',
  '"I need a plant update"',
  'Same pants 5 days in a row',
  'Late for a meeting',
  'Hand on his belly like Santa',
  '"The wife"',
  '"I need you guys to..."',
  '"We need to tell our story better"',
  '"I\'ll follow up on that" (never does)',
  'Plays with his fidget during meeting',
  '"Big-picture" pivot mid-convo',
  '"The design-to-install multiplier"',
  'Sells something we don\'t do',
  'Blames the client',
  '"We need to prioritize..."',
  '"Let me loop in my buddy"',
  '"As a boss I should be..."',
  '"Oh man, there\'s some good fishing over there"',
  '"They need to pay their invoice first"',
  'Makes a personal excuse for a missed client deadline',
  'Leaves dishes in the sink',
];

const FREE_SQUARE = { text: '🌿\nFREE\nSURVIVE THE MEETING', isFree: true };

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeCard(cardIndex) {
  const shuffled = shuffle(ALL_SQUARES).slice(0, 24);
  // Insert free space at position 12 (center)
  const cells = [
    ...shuffled.slice(0, 12),
    FREE_SQUARE,
    ...shuffled.slice(12),
  ];

  const card = document.createElement('div');
  card.className = 'bingo-card';

  card.innerHTML = `
    <div class="card-header">
      <div class="card-title">N · I · N · G · O</div>
      <div class="card-num">CARD #${cardIndex + 1}</div>
    </div>
    <div class="bingo-letters">
      <div class="bingo-letter">N</div>
      <div class="bingo-letter">I</div>
      <div class="bingo-letter">N</div>
      <div class="bingo-letter">G</div>
      <div class="bingo-letter">O</div>
    </div>
    <div class="bingo-grid">
      ${cells.map((sq, i) => {
        if (sq.isFree) {
          return `<div class="bingo-cell free-space"><span class="free-icon">🌿</span>FREE<br>SPACE</div>`;
        }
        return `<div class="bingo-cell" onclick="this.classList.toggle('marked')">${sq}</div>`;
      }).join('')}
    </div>
  `;

  return card;
}

const grid = document.getElementById('cardsGrid');
for (let i = 0; i < 14; i++) {
  grid.appendChild(makeCard(i));
}
</script>

</body>
</html>
